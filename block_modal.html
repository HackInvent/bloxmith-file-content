<div data-properties-surface="modal" class="modal-panel block-config-modal cw-file-inspector cw-file-content-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-file-modal-root data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker"><span data-i18n="ui.block_kit.block">Block</span> {{ node_kind_title }}</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button>
    </div>
  </div>
  <div class="block-config-modal-body">
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.identity">Identity</span></div>
      {{ title_field_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="block.file_content.file_section">File content</span></div>
      {{ path_browser_html }}
      <label class="checkbox-field">
        <input data-file-create-if-missing type="checkbox" {{ checked }} />
        <span data-i18n="block.file_content.create_if_missing_label">Create the file if it does not exist</span>
      </label>
      <div class="inspector-actions">
        <button class="solid-btn" data-file-apply type="button" disabled data-i18n="block.file_content.apply_file">Apply the file</button>
      </div>
      <p class="inspector-copy" data-i18n="block.file_content.hint">{{ hint }}</p>
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="block.file_content.technical_section">Technical attributes</span></div>
      {{ config_fields_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.ports">Ports</span></div>
      {{ ports_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.last_state">Last state</span></div>
      {{ runtime_html }}
    </section>
  </div>
</div>
