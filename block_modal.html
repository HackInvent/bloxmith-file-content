<div class="modal-panel block-config-modal cw-file-inspector cw-file-content-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-file-modal-root data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker">Bloc {{ node_kind_title }}</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Fermer</button>
    </div>
  </div>
  <div class="block-config-modal-body">
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Identité</span></div>
      {{ title_field_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Fichier contenu</span></div>
      {{ path_browser_html }}
      <label class="checkbox-field">
        <input data-file-create-if-missing type="checkbox" {{ checked }} />
        <span>Créer le fichier s'il n'existe pas</span>
      </label>
      <div class="inspector-actions">
        <button class="solid-btn" data-file-apply type="button" disabled>Appliquer le fichier</button>
      </div>
      <p class="inspector-copy">{{ hint }}</p>
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Attributs techniques</span></div>
      {{ config_fields_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Ports</span></div>
      {{ ports_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Dernier état</span></div>
      {{ runtime_html }}
    </section>
  </div>
</div>
